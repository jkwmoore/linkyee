<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{ title }}</title>

  <meta name="last-modified" content="{{ last_modified_at }}" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta property="og:title" content="{{ title }}" />
  <meta name="author" content="{{ name }}" />
  <meta property="og:locale" content="en" />
  <meta name="description" content="{{ tagline }}" />
  <meta property="og:description" content="{{ tagline }}" />
  <meta property="og:site_name" content="{{ title }}" />
  <meta property="og:image" content="{{ avatar }}" />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ avatar }}" />
  <meta name="twitter:title" content="{{ title }}" />

  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicons/favicon-16x16.png" />
  <link rel="manifest" href="./images/favicons/site.webmanifest" />
  <link rel="shortcut icon" href="./images/favicons/favicon.ico" />
  <link rel="me" href="https://mast.hpc.social/@jkwmoore" />
  <meta name="apple-mobile-web-app-title" content="{{ title }}" />
  <meta name="application-name" content="{{ title }}" />
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="msapplication-config" content="./images/favicons/browserconfig.xml" />
  <meta name="fediverse:creator" content="@jkwmoore@mast.hpc.social" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <div class="profile">
      <img src="{{ avatar }}" alt="{{ name }} profile picture" class="profile-pic" />
      <h1 class="name">{{ name }}</h1>
      <p class="description">{{ tagline }}</p>
    </div>

    <div class="links">
      {% for item in links %}
        {% assign link = item.link %}
        <a href="{{ link.url }}" target="{{ link.target }}" class="link-button" title="{{ link.title }}">
          <i class="{{ link.icon }}" aria-hidden="true"></i>
          <span>{{ link.text }}</span>
        </a>
      {% endfor %}

      <button type="button" id="qr-toggle-button" class="link-button" aria-expanded="false" aria-controls="qr-container">
        <i class="fas fa-qrcode" aria-hidden="true"></i>
        <span>Show QR code link to this page</span>
      </button>

      <div id="qr-container" class="qr-code-section hidden">
        <!-- Keep a single clean QR <svg viewBox="0 0 2000 2000"> here without nested <svg> tags -->
      </div>
    </div>

    <div class="button-container">
      <div class="button-group">
        {% for item in socials %}
          {% assign social = item.social %}
          <a href="{{ social.url }}" title="{{ social.title }}" aria-label="{{ social.title }}" target="{{ social.target }}" class="icon-button">
            <i class="{{ social.icon }}" aria-hidden="true"></i>
          </a>
        {% endfor %}
      </div>
    </div>

    <footer class="footer">
      {{ footer }}
      <div class="copyright">{{ copyright }}</div>
    </footer>
  </div>

  <script src="fontawesome/js/all.js" data-auto-replace-svg="nest" defer></script>
  {% if google_analytics_id %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ google_analytics_id }}');
    </script>
  {% endif %}
  <script src="./scripts.js" defer></script>
</body>
</html>
